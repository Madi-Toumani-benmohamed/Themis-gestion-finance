<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F4F9" />
    <title>thémis. — la balance de tes comptes</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235B5BD6'/%3E%3Cg fill='none' stroke='%23FFFFFF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 5v22'/%3E%3Cpath d='M11 27h10'/%3E%3Cpath d='M7 9h18'/%3E%3Ccircle cx='16' cy='6.5' r='1.6' fill='%23FFFFFF' stroke='none'/%3E%3Cpath d='M7 9l-3 6M7 9l3 6'/%3E%3Cpath d='M3.2 15a3.8 2 0 0 0 7.6 0z'/%3E%3Cpath d='M25 9l-3 6M25 9l3 6'/%3E%3Cpath d='M21.2 15a3.8 2 0 0 0 7.6 0z'/%3E%3C/g%3E%3C/svg%3E" />
    <script>
      // Anti-flash : appliquer le thème sauvegardé AVANT le premier rendu.
      // Remplace l'ancien style inline qui figeait le fond en clair.
      (function () {
        try {
          var t = localStorage.getItem('themis-theme') || 'light';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.background = t === 'dark' ? '#10111B' : '#F4F4F9';
        } catch (e) {}
      })();
      // Anti-flash motion : appliquer la préférence de mouvement AVANT le premier rendu.
      // Évite un flash d'animations si prefers-reduced-motion est actif ou si l'utilisateur a choisi "reduced/off".
      (function () {
        try {
          var m = localStorage.getItem('themis-motion') || 'auto';
          var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var mode = m === 'off' ? 'off' : m === 'reduced' || (m === 'auto' && reduced) ? 'reduced' : 'full';
          document.documentElement.dataset.motion = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
