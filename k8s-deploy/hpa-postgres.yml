apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: postgres
  namespace: dev
spec:
  maxReplicas: 5
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 50
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: postgres
status:
  currentMetrics: null
  desiredReplicas: 0
