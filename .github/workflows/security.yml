
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -------------------------------------------
  # SAST - Static Application Security Testing
  # -------------------------------------------
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static security analysis
        run: |
          semgrep scan \
            --config p/security-audit \
            --error \
            .

  # -------------------------------------------
  # SCA - Dependencies and configurations
  # -------------------------------------------
  dependencies:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          hide-progress: true

  # -------------------------------------------
  # Go standard library and module security
  # -------------------------------------------
  go-security:
    name: Go - Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Install govulncheck
        run: |
          go install \
            golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run vulnerability check
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
