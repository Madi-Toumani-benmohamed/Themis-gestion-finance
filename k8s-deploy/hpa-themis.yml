apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: themis-app
  namespace: dev
spec:
  maxReplicas: 5
  metrics:
  - resource:
      name: memory
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: themis-app
status:
  currentMetrics: null
  desiredReplicas: 0
