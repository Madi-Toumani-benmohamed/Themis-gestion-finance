# thémis — image unique : le backend sert l'API ET le frontend sur :8080.
#   IMPORTANT au moindre changement de code :
#     docker compose build --no-cache app   # reconstruit front + back
#     docker compose up -d
#
services:
  # Le contexte de build est la racine du repo pour inclure backend
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres.hmqzyokbcrdxboeizztb:${SUPABASE_PASSWORD}@aws-0-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
    ports:
      - "8080:8080"   # → http://localhost:8080  (app complète : UI + API)
