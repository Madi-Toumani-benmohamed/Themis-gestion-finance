apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app: postgres
  name: postgres
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postgres
  serviceName: "postgres"
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
      - image: postgres:16-alpine 
        name: postgres
        resources: 
          requests: { cpu: 100m, memory: 64Mi }
          limits: { memory: 128Mi }
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data-db
        - mountPath: /var/run/postgresql
          name: postgres-run
        - mountPath: /tmp
          name: postgres-tmp
        env:
          - name: POSTGRES_USER
            valueFrom:
              configMapKeyRef:
                name: postgres-cm 
                key: POSTGRES_USER
          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                name: postgres-cm
                key: POSTGRES_DB
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret # Assurez-vous que ce Secret existe
                key: POSTGRES_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        

        ports:
        - containerPort: 5432
      volumes:
      - name: postgres-run
        emptyDir: {}
      - name: postgres-tmp
        emptyDir: {}
      - name: data-db
        persistentVolumeClaim:
          claimName: pvc-postgres

  volumeClaimTemplates:
  - metadata:
      name: data-db
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
