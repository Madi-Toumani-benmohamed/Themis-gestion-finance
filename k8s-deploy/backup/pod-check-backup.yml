apiVersion: v1
kind: Pod
metadata:
  name: temp-verification-pod
  namespace: dev
spec:
  containers:
    - name: busybox
      image: busybox
      command: ["sh", "-c", "tail -f /dev/null"]
      volumeMounts:
        - mountPath: "/backup"
          name: backup-volume
  volumes:
    - name: backup-volume
      persistentVolumeClaim:
        claimName: postgres-backup-pvc
