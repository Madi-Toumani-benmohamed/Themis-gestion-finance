# thémis — image unique : le backend sert l'API ET le frontend sur :8080.
#
#   IMPORTANT au moindre changement de code :
#     docker compose build --no-cache app   # reconstruit front + back
#     docker compose up -d
#
# Tous les identifiants, ports et versions d'images viennent du .env
# (déjà ignoré par Git). Aucun secret n'est commit dans ce fichier.

services:
  db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      retries: 10

  # FalkorDB — graphe de connaissances pour le Knowledge Graph service
  falkordb:
    image: falkordb/falkordb:latest
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Knowledge Graph service (Graphiti via FastAPI)
  knowledge-graph:
    build:
      context: .
      dockerfile: memory/Dockerfile
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      OLLAMA_URL: ${REMOTE_OLLAMA_BASE_URL:-http://ollama:11434}/v1
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_EMBED_MODEL: nomic-embed-text
      KG_SERVICE_PORT: 8100
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "8100:8100"

  # Le contexte de build est la racine du repo pour inclure backend/ ET frontend/
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_URL: ${REMOTE_OLLAMA_BASE_URL:-${OLLAMA_URL:-}}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
      # Knowledge Graph
      MEMORY_SERVICE_URL: http://knowledge-graph:8100
      MEMORY_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      knowledge-graph:
        condition: service_started
    ports:
      - "${APP_PORT}:8080"   # → http://localhost:${APP_PORT}  (app complète : UI + API)

  ollama:
    image: ${OLLAMA_IMAGE}
    profiles: ["local-ai"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT}:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  ollama:
  falkordb_data: