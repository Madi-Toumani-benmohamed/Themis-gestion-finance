name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/budget-financial-invariants, feat/budgets-ux]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Go
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: themis_test
          POSTGRES_PASSWORD: isolated_test_password
          POSTGRES_DB: themis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U themis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      THEMIS_TEST_DATABASE_URL: postgres://themis_test:isolated_test_password@localhost:5432/themis_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Run tests
        working-directory: backend
        run: go test -race ./...

      - name: Run go vet
        working-directory: backend
        run: go vet ./...

  frontend:
    name: Frontend React
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: node --test src/components/*.test.mjs

      - name: Build frontend
        run: npm run build

  budgets-ui:
    name: Financial pages browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/themis-ui" --no-audit --no-fund playwright@1.64.1 @axe-core/playwright@4.14.0
          "$RUNNER_TEMP/themis-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check transactions, budgets, simulation and analysis flows, responsive layout and accessibility
        env:
          NODE_PATH: ${{ runner.temp }}/themis-ui/node_modules
          THEMIS_UI_ARTIFACTS: ${{ runner.temp }}/themis-budgets-ui
          THEMIS_TRANSACTIONS_ARTIFACTS: ${{ runner.temp }}/themis-transactions-ui
        run: |
          npm run dev -- --host 127.0.0.1 --port 5176 > "$RUNNER_TEMP/themis-ui-vite.log" 2>&1 &
          THEMIS_UI_PID=$!
          trap 'kill "$THEMIS_UI_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:5176; then break; fi
            echo "Waiting for UI server ($attempt/30)..."
            sleep 1
          done
          node tests/transactions.browser.cjs
          node tests/budgets.browser.cjs
          node tests/simulation.browser.cjs
          node tests/analysis.browser.cjs

  memory:
    name: Knowledge Graph Python
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m compileall -q memory

      - name: Test diagnostic HTTP transport
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v

  docker:
    name: Build and publish Docker image
    needs: [backend, frontend, budgets-ui, memory, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=themis-app
          cache-to: type=gha,scope=themis-app,mode=min,ignore-error=true

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate main Compose configuration
        run: docker compose -f docker-compose.yml --env-file example.env  --profile local-ai config --quiet

      - name: Validate Supabase Compose configuration
        run: |
          cp example.env .env
          docker compose --env-file example.env \
            -f compose-supabase/docker-compose.yml \
            config --quiet
          rm .env
